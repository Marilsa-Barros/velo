# Workflow de Integração Contínua focado exclusivamente em testes unitários.
# Estrutura simples e preparada para expansão futura (novos jobs, stages, etc).

name: Continuous Integration

on:
  push:
    branches:
      - main

# Versão do Node utilizada em todo o workflow
env:
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Realiza o checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js utilizando a versão definida globalmente
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto utilizando Yarn
      - name: Install dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
